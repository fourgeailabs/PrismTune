name: PrismTune CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # File modes do not survive the git-database API push, so the wrapper
      # must be made executable here (same lesson as BPWatch/NeuroPath).
      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --console=plain

      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --console=plain

      # CI artifact only — no APK is ever delivered in chat, per project policy.
      - name: Upload debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: prismtune-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
