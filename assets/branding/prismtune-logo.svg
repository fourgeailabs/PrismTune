<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 108 108">
  <defs>
    <linearGradient id="prism" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="0.55" stop-color="#FFB020"/>
      <stop offset="1" stop-color="#E8890C"/>
    </linearGradient>
  </defs>
  <rect width="108" height="108" rx="24" fill="#14100C"/>
  <!-- incoming beam -->
  <line x1="4" y1="42" x2="32" y2="42" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <!-- prism -->
  <polygon points="54,14 90,66 18,66" fill="url(#prism)" stroke="#3A2A00" stroke-width="1.5"/>
  <line x1="54" y1="14" x2="54" y2="66" stroke="#7A4A00" stroke-width="3"/>
  <!-- refracted sound beams -->
  <line x1="78" y1="46" x2="104" y2="34" stroke="#FFB020" stroke-width="7" stroke-linecap="round"/>
  <line x1="78" y1="54" x2="104" y2="60" stroke="#FFB020" stroke-width="7" stroke-linecap="round"/>
  <line x1="78" y1="62" x2="104" y2="86" stroke="#FFB020" stroke-width="7" stroke-linecap="round"/>
  <!-- equalizer bars -->
  <g stroke="#FFB020" stroke-width="7" stroke-linecap="round">
    <line x1="26" y1="98" x2="26" y2="84"/>
    <line x1="41" y1="98" x2="41" y2="74"/>
    <line x1="56" y1="98" x2="56" y2="88"/>
    <line x1="71" y1="98" x2="71" y2="70"/>
    <line x1="86" y1="98" x2="86" y2="80"/>
  </g>
  <text x="54" y="106" font-family="sans-serif" font-size="0" fill="none">PrismTune</text>
</svg>
